<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="브라우저에서 바로 즐기는 클래식 테트리스. 고스트 피스, 홀드, 하드 드롭 지원.">
    <meta name="theme-color" content="#101416">
    <title>Classic Tetris</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23101416'/><rect x='5' y='5' width='11' height='11' fill='%2334c7a1'/><rect x='16' y='16' width='11' height='11' fill='%23f0c64a'/></svg>">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app">
      <section class="play-area" aria-label="게임 보드">
        <div class="board-shell">
          <canvas id="board" aria-label="테트리스 보드"></canvas>
          <div id="overlay" class="overlay is-visible" aria-hidden="false">
            <h1 id="overlayTitle">Classic Tetris</h1>
            <p id="overlayText" role="status">Enter 또는 Start로 시작</p>
            <button id="overlayButton" type="button">Start</button>
          </div>
        </div>
        <div class="dancer" aria-hidden="true">
          <div class="dancer-shadow"></div>
          <div class="dancer-body">
            <span class="dancer-hat"></span>
            <span class="dancer-head"></span>
            <span class="dancer-arm dancer-arm-left"></span>
            <span class="dancer-arm dancer-arm-right"></span>
            <span class="dancer-coat"></span>
            <span class="dancer-belt"></span>
            <span class="dancer-leg dancer-leg-left"></span>
            <span class="dancer-leg dancer-leg-right"></span>
            <span class="dancer-boot dancer-boot-left"></span>
            <span class="dancer-boot dancer-boot-right"></span>
          </div>
        </div>
      </section>

      <aside class="panel" aria-label="점수와 조작">
        <div class="brand">
          <span class="mark" aria-hidden="true"></span>
          <div>
            <p>Classic</p>
            <h2>Tetris</h2>
          </div>
        </div>

        <div class="stats" aria-label="점수판">
          <div>
            <span>점수</span>
            <strong id="score">0</strong>
          </div>
          <div>
            <span>최고</span>
            <strong id="best">0</strong>
          </div>
          <div>
            <span>레벨</span>
            <strong id="level">1</strong>
          </div>
          <div>
            <span>줄</span>
            <strong id="lines">0</strong>
          </div>
        </div>

        <div class="previews">
          <div class="preview-box">
            <span>홀드</span>
            <canvas id="hold" aria-label="보관 중인 조각"></canvas>
          </div>
          <div class="preview-box">
            <span>다음</span>
            <canvas id="next" aria-label="다음 조각 3개"></canvas>
          </div>
        </div>

        <div class="actions">
          <button id="startButton" type="button">Start</button>
          <button id="pauseButton" type="button" disabled>Pause</button>
          <button id="soundButton" type="button" aria-pressed="false">Sound: Off</button>
        </div>

        <div class="touch-controls" aria-label="터치 조작">
          <button type="button" data-action="counter" aria-label="반시계 회전">↺</button>
          <button type="button" data-action="drop" aria-label="하드 드롭">⤓</button>
          <button type="button" data-action="rotate" aria-label="시계 회전">↻</button>
          <button type="button" data-action="left" aria-label="왼쪽으로 이동">←</button>
          <button type="button" data-action="down" aria-label="소프트 드롭">↓</button>
          <button type="button" data-action="right" aria-label="오른쪽으로 이동">→</button>
          <button type="button" data-action="hold" class="wide" aria-label="조각 보관">홀드</button>
        </div>

        <div class="controls">
          <h3>키보드</h3>
          <dl>
            <div><dt>이동</dt><dd>← →</dd></div>
            <div><dt>소프트 드롭</dt><dd>↓</dd></div>
            <div><dt>하드 드롭</dt><dd>Space</dd></div>
            <div><dt>시계 회전</dt><dd>↑ / X</dd></div>
            <div><dt>반시계 회전</dt><dd>Z</dd></div>
            <div><dt>홀드</dt><dd>C</dd></div>
            <div><dt>일시정지</dt><dd>P</dd></div>
          </dl>
        </div>
      </aside>
    </main>

    <script src="game.js"></script>
  </body>
</html>
